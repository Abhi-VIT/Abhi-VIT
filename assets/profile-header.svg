<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Abhishek Kumar - Data Scientist and Machine Learning Engineer</title>
  <desc id="desc">A dark blue gradient banner with a stylized neural network and professional introduction.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="30" x2="1110" y2="335" gradientUnits="userSpaceOnUse"><stop stop-color="#071426"/><stop offset="0.5" stop-color="#0A2342"/><stop offset="1" stop-color="#102A43"/></linearGradient>
    <linearGradient id="accent" x1="88" y1="0" x2="650" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="0.55" stop-color="#818CF8"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(994 178) rotate(90) scale(250)" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8" stop-opacity="0.18"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#93C5FD" stroke-opacity="0.05" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/><rect width="1200" height="360" rx="28" fill="url(#grid)"/><rect x="760" width="440" height="360" rx="28" fill="url(#glow)"/>
  <circle cx="86" cy="66" r="7" fill="#38BDF8"/><text x="105" y="72" fill="#BAE6FD" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2.2">HELLO, I'M</text>
  <text x="82" y="145" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.8">Abhishek Kumar</text><rect x="84" y="166" width="590" height="4" rx="2" fill="url(#accent)"/>
  <text x="84" y="215" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="24" font-weight="500">Data Scientist  ·  ML Engineer  ·  Analytics</text><text x="84" y="257" fill="#94A3B8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">Turning complex data into useful, human-centered systems.</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600"><rect x="84" y="287" width="112" height="38" rx="19" fill="#0EA5E9" fill-opacity="0.13" stroke="#38BDF8" stroke-opacity="0.55"/><text x="108" y="311" fill="#BAE6FD">Python</text><rect x="210" y="287" width="163" height="38" rx="19" fill="#6366F1" fill-opacity="0.13" stroke="#818CF8" stroke-opacity="0.55"/><text x="235" y="311" fill="#C7D2FE">Deep Learning</text><rect x="387" y="287" width="179" height="38" rx="19" fill="#A855F7" fill-opacity="0.13" stroke="#C084FC" stroke-opacity="0.55"/><text x="412" y="311" fill="#E9D5FF">Knowledge Graphs</text></g>
  <g stroke-linecap="round"><path d="M840 92L928 62L1000 113L1095 79M840 92L878 179L973 174L1000 113M878 179L827 265L930 296L973 174M973 174L1063 240L1095 79M930 296L1063 240L1112 309" stroke="#7DD3FC" stroke-opacity="0.24" stroke-width="2"/><path d="M928 62L973 174M1000 113L1063 240M878 179L1063 240" stroke="#A5B4FC" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="5 9"/></g>
  <g filter="url(#softGlow)"><circle cx="840" cy="92" r="7" fill="#38BDF8"/><circle cx="928" cy="62" r="5" fill="#818CF8"/><circle cx="1000" cy="113" r="9" fill="#C084FC"/><circle cx="1095" cy="79" r="5" fill="#38BDF8"/><circle cx="878" cy="179" r="9" fill="#818CF8"/><circle cx="973" cy="174" r="12" fill="#38BDF8"/><circle cx="827" cy="265" r="6" fill="#C084FC"/><circle cx="930" cy="296" r="8" fill="#38BDF8"/><circle cx="1063" cy="240" r="10" fill="#818CF8"/><circle cx="1112" cy="309" r="5" fill="#C084FC"/></g>
