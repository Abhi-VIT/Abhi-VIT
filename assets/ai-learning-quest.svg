<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="questTitle questDesc">
  <title id="questTitle">AI Learning Quest animated mini-game</title>
  <desc id="questDesc">A small robot travels through data, feature engineering, model training, and prediction checkpoints.</desc>
  <defs>
    <linearGradient id="questBg" x1="30" y1="20" x2="1170" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#071426"/><stop offset="0.5" stop-color="#111C38"/><stop offset="1" stop-color="#1A1038"/></linearGradient>
    <linearGradient id="questLine" x1="130" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <filter id="questGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="questGrid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#93C5FD" stroke-opacity="0.045"/></pattern>
    <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#questBg)"/><rect width="1200" height="320" rx="24" fill="url(#questGrid)"/><rect x="1" y="1" width="1198" height="318" rx="23" stroke="#475569" stroke-opacity="0.45"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="54" y="52" fill="#F8FAFC" font-size="23" font-weight="700">AI LEARNING QUEST</text>
    <text x="54" y="78" fill="#94A3B8" font-size="14" letter-spacing="1.2">LEVEL 01  /  TURN RAW SIGNALS INTO A USEFUL PREDICTION</text>
    <rect x="935" y="34" width="210" height="38" rx="19" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.55"/>
    <circle cx="960" cy="53" r="6" fill="#22C55E"><animate class="motion" attributeName="opacity" values="1;0.25;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="976" y="59" fill="#C7D2FE" font-size="14" font-weight="600">MODEL IS LEARNING</text>
  </g>

  <path d="M140 184C260 115 385 225 520 171S770 110 920 174S1040 172 1090 119" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <path d="M140 184C260 115 385 225 520 171S770 110 920 174S1040 172 1090 119" stroke="url(#questLine)" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 14"><animate class="motion" attributeName="stroke-dashoffset" values="0;-68" dur="2.2s" repeatCount="indefinite"/></path>

  <g fill="#BAE6FD" opacity="0.85">
    <circle cx="213" cy="155" r="4"><animate class="motion" attributeName="opacity" values="1;0.15;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="285" cy="157" r="4"><animate class="motion" attributeName="opacity" values="1;0.15;1" dur="2.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="365" cy="190" r="4"><animate class="motion" attributeName="opacity" values="1;0.15;1" dur="2.1s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="455" cy="191" r="4"><animate class="motion" attributeName="opacity" values="1;0.15;1" dur="2.1s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(140 184)"><circle r="31" fill="#082F49" stroke="#38BDF8" stroke-width="2"/><path d="M-12 -7H12M-12 0H7M-12 7H3" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round"/><text y="55" fill="#BAE6FD" font-size="14" font-weight="700">DATA</text><text y="75" fill="#64748B" font-size="12">collect</text></g>
    <g transform="translate(440 195)"><circle r="31" fill="#1E1B4B" stroke="#818CF8" stroke-width="2"/><path d="M-14 -12L0 0L14 -12M-14 0L0 12L14 0" stroke="#C7D2FE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text y="55" fill="#C7D2FE" font-size="14" font-weight="700">FEATURES</text><text y="75" fill="#64748B" font-size="12">represent</text></g>
    <g transform="translate(728 137)"><circle r="36" fill="#2E1065" stroke="#C084FC" stroke-width="2"/><g stroke="#D8B4FE" stroke-opacity="0.7"><path d="M-18 -13L0 -18L19 -10M-18 -13L0 1L19 -10M-18 13L0 1L19 11M-18 13L0 18L19 11"/></g><g fill="#F3E8FF"><circle cx="-18" cy="-13" r="4"/><circle cx="-18" cy="13" r="4"/><circle cy="-18" r="4"/><circle cy="1" r="4"/><circle cy="18" r="4"/><circle cx="19" cy="-10" r="4"/><circle cx="19" cy="11" r="4"/></g><circle class="motion" r="30" fill="none" stroke="#E879F9" stroke-width="2"><animate attributeName="r" values="30;43;30" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.65;0;0.65" dur="2.4s" repeatCount="indefinite"/></circle><text y="62" fill="#E9D5FF" font-size="14" font-weight="700">MODEL</text><text y="82" fill="#64748B" font-size="12">learn</text></g>
    <g transform="translate(1090 119)"><circle r="33" fill="#500724" stroke="#F472B6" stroke-width="2"/><path d="M0 -17L5 -6L17 -5L8 3L11 16L0 9L-11 16L-8 3L-17 -5L-5 -6Z" fill="#FBCFE8"><animate class="motion" attributeName="opacity" values="0.5;1;0.5" dur="1.3s" repeatCount="indefinite"/></path><text y="58" fill="#FBCFE8" font-size="14" font-weight="700">PREDICT</text><text y="78" fill="#64748B" font-size="12">deliver</text></g>
  </g>

  <g class="motion" filter="url(#questGlow)">
    <g>
      <rect x="-20" y="-15" width="40" height="30" rx="9" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/><rect x="-12" y="-7" width="24" height="13" rx="5" fill="#0F172A"/><circle cx="-6" cy="-1" r="2.5" fill="#38BDF8"/><circle cx="6" cy="-1" r="2.5" fill="#C084FC"/><path d="M-8 20L-2 14M8 20L2 14M0 -15V-22" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round"/><circle cy="-24" r="3" fill="#F472B6"/>
      <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" path="M140 184C260 115 385 225 520 171S770 110 920 174S1040 172 1090 119"/>
    </g>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="54" y="292" fill="#64748B" font-size="12">TRAINING PROGRESS</text><rect x="184" y="281" width="650" height="10" rx="5" fill="#1E293B"/><rect x="184" y="281" width="650" height="10" rx="5" fill="url(#questLine)"><animate class="motion" attributeName="width" values="0;650;650" keyTimes="0;0.88;1" dur="9s" repeatCount="indefinite"/></rect><text x="858" y="292" fill="#A5B4FC" font-size="12" font-weight="700">LOSS ↓</text><text x="1084" y="292" fill="#F9A8D4" font-size="12" text-anchor="end">READY TO SHIP</text>
  </g>
</svg>
