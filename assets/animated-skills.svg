<svg width="1200" height="350" viewBox="0 0 1200 350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skillsTitle skillsDesc">
  <title id="skillsTitle">Animated machine learning skill system</title>
  <desc id="skillsDesc">Three animated panels show modeling, data, and engineering skills.</desc>
  <defs>
    <linearGradient id="skillsBg" x1="0" y1="0" x2="1200" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#071426"/><stop offset="0.5" stop-color="#0F1B35"/><stop offset="1" stop-color="#10172E"/></linearGradient>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="250" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#0284C7"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
    <linearGradient id="violetBar" x1="0" y1="0" x2="250" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <linearGradient id="pinkBar" x1="0" y1="0" x2="250" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#A855F7"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <filter id="skillsGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  </defs>

  <rect width="1200" height="350" rx="24" fill="url(#skillsBg)"/><rect x="1" y="1" width="1198" height="348" rx="23" stroke="#334155"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif"><text x="52" y="49" fill="#F8FAFC" font-size="22" font-weight="700">MY ML SYSTEM</text><text x="52" y="73" fill="#64748B" font-size="13" letter-spacing="1.1">FROM EXPERIMENT TO DEPLOYMENT</text><text x="1148" y="53" text-anchor="end" fill="#38BDF8" font-size="12">● LIVE TOOLKIT</text></g>

  <g transform="translate(48 98)">
    <rect width="344" height="210" rx="18" fill="#0B1E33" stroke="#0EA5E9" stroke-opacity="0.55"/><rect x="1" y="1" width="342" height="4" rx="2" fill="url(#cyanBar)"><animate class="motion" attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/></rect>
    <g font-family="Segoe UI, Inter, Arial, sans-serif"><text x="24" y="38" fill="#7DD3FC" font-size="13" font-weight="700" letter-spacing="1.5">01 / MODEL</text><text x="24" y="69" fill="#F8FAFC" font-size="20" font-weight="700">Learn the signal</text><text x="24" y="96" fill="#94A3B8" font-size="13">Python · Scikit-learn</text><text x="24" y="118" fill="#94A3B8" font-size="13">TensorFlow · PyTorch</text></g>
    <g transform="translate(276 69)"><circle r="35" stroke="#164E63" stroke-width="7"/><circle r="35" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-dasharray="82 138"><animateTransform class="motion" attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/></circle><circle r="5" fill="#BAE6FD" filter="url(#skillsGlow)"><animate class="motion" attributeName="r" values="4;7;4" dur="1.7s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(24 149)"><rect width="285" height="8" rx="4" fill="#172A3E"/><rect width="258" height="8" rx="4" fill="url(#cyanBar)"><animate class="motion" attributeName="width" values="180;270;258;180" dur="5s" repeatCount="indefinite"/></rect><text y="34" fill="#64748B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">TRAIN • EVALUATE • TUNE</text></g>
  </g>

  <g transform="translate(428 98)">
    <rect width="344" height="210" rx="18" fill="#131735" stroke="#818CF8" stroke-opacity="0.55"/><rect x="1" y="1" width="342" height="4" rx="2" fill="url(#violetBar)"><animate class="motion" attributeName="opacity" values="0.35;1;0.35" dur="2.7s" begin="0.4s" repeatCount="indefinite"/></rect>
    <g font-family="Segoe UI, Inter, Arial, sans-serif"><text x="24" y="38" fill="#A5B4FC" font-size="13" font-weight="700" letter-spacing="1.5">02 / DATA</text><text x="24" y="69" fill="#F8FAFC" font-size="20" font-weight="700">Shape the context</text><text x="24" y="96" fill="#94A3B8" font-size="13">Pandas · NumPy · SQL</text><text x="24" y="118" fill="#94A3B8" font-size="13">Neo4j · MongoDB · BI</text></g>
    <g transform="translate(277 70)" stroke="#C7D2FE" stroke-opacity="0.65"><path d="M-29 20L-12 -4L2 8L28 -22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g fill="#818CF8" stroke="none"><circle cx="-29" cy="20" r="5"/><circle cx="-12" cy="-4" r="5"/><circle cx="2" cy="8" r="5"/><circle cx="28" cy="-22" r="5"/></g><circle class="motion" cx="28" cy="-22" r="5" fill="none" stroke="#C4B5FD" stroke-width="2"><animate attributeName="r" values="5;16;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(24 149)"><rect width="285" height="8" rx="4" fill="#22264A"/><rect width="248" height="8" rx="4" fill="url(#violetBar)"><animate class="motion" attributeName="width" values="160;264;248;160" dur="5.4s" begin="0.5s" repeatCount="indefinite"/></rect><text y="34" fill="#64748B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">CLEAN • CONNECT • VISUALIZE</text></g>
  </g>

  <g transform="translate(808 98)">
    <rect width="344" height="210" rx="18" fill="#21112F" stroke="#C084FC" stroke-opacity="0.55"/><rect x="1" y="1" width="342" height="4" rx="2" fill="url(#pinkBar)"><animate class="motion" attributeName="opacity" values="0.35;1;0.35" dur="2.5s" begin="0.8s" repeatCount="indefinite"/></rect>
    <g font-family="Segoe UI, Inter, Arial, sans-serif"><text x="24" y="38" fill="#E879F9" font-size="13" font-weight="700" letter-spacing="1.5">03 / BUILD</text><text x="24" y="69" fill="#F8FAFC" font-size="20" font-weight="700">Ship the outcome</text><text x="24" y="96" fill="#94A3B8" font-size="13">Streamlit · Django · Git</text><text x="24" y="118" fill="#94A3B8" font-size="13">AWS · OCI · Monitoring</text></g>
    <g transform="translate(277 69)"><path d="M0 -30L28 -14V17L0 33L-28 17V-14Z" fill="#3B164C" stroke="#E879F9" stroke-width="2"/><path d="M-14 2L-4 12L16 -11" stroke="#F5D0FE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="motion" d="M0 -38L34 -19V21L0 40L-34 21V-19Z" fill="none" stroke="#F472B6" stroke-opacity="0.6"><animate attributeName="stroke-dasharray" values="2 8;12 3;2 8" dur="3s" repeatCount="indefinite"/></path></g>
    <g transform="translate(24 149)"><rect width="285" height="8" rx="4" fill="#321A3B"/><rect width="237" height="8" rx="4" fill="url(#pinkBar)"><animate class="motion" attributeName="width" values="150;254;237;150" dur="5.2s" begin="1s" repeatCount="indefinite"/></rect><text y="34" fill="#64748B" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11">DEPLOY • OBSERVE • IMPROVE</text></g>
  </g>
</svg>
