<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="labTitle labDesc">
  <title id="labTitle">Live machine learning lab animation</title>
  <desc id="labDesc">An animated terminal trains a neural network while loss decreases and accuracy rises.</desc>
  <defs>
    <linearGradient id="labBg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse"><stop stop-color="#061322"/><stop offset="0.55" stop-color="#0C1830"/><stop offset="1" stop-color="#17102C"/></linearGradient>
    <linearGradient id="labAccent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <filter id="labGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="chartClip"><rect x="785" y="127" width="326" height="145" rx="8"/></clipPath>
    <pattern id="labGrid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#94A3B8" stroke-opacity="0.045"/></pattern>
    <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#labBg)"/><rect width="1200" height="380" rx="24" fill="url(#labGrid)"/><rect x="1" y="1" width="1198" height="378" rx="23" stroke="#334155"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="48" y="46" fill="#F8FAFC" font-size="22" font-weight="700">LIVE ML LAB</text><text x="48" y="70" fill="#64748B" font-size="12" letter-spacing="1.2">EXPERIMENT / TRAIN / EVALUATE / REPEAT</text>
    <rect x="980" y="29" width="172" height="34" rx="17" fill="#052E2B" stroke="#22C55E" stroke-opacity="0.55"/><circle cx="1003" cy="46" r="5" fill="#4ADE80"><animate class="motion" attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle><text x="1017" y="51" fill="#86EFAC" font-size="12" font-weight="700">RUNNING</text>
  </g>

  <g transform="translate(48 94)">
    <rect width="670" height="238" rx="16" fill="#030712" stroke="#1E3A5F"/>
    <rect width="670" height="38" rx="16" fill="#0F172A"/><rect y="22" width="670" height="16" fill="#0F172A"/>
    <circle cx="22" cy="19" r="5" fill="#FB7185"/><circle cx="40" cy="19" r="5" fill="#FBBF24"/><circle cx="58" cy="19" r="5" fill="#4ADE80"/>
    <text x="335" y="24" text-anchor="middle" fill="#64748B" font-family="Consolas, monospace" font-size="12">training.py — neural-lab</text>
    <g font-family="Consolas, Cascadia Mono, monospace" font-size="14">
      <text x="24" y="72" fill="#64748B">$</text><text x="45" y="72" fill="#E2E8F0">python training.py --model cnn --epochs 50</text>
      <text x="24" y="104" fill="#38BDF8">[data]</text><text x="88" y="104" fill="#94A3B8">loaded 48,000 samples</text>
      <g opacity="1"><text x="24" y="136" fill="#818CF8">[prep]</text><text x="88" y="136" fill="#94A3B8">features normalized · split 80/20</text><animate class="motion" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.18;1" dur="8s" repeatCount="indefinite"/></g>
      <g opacity="1"><text x="24" y="168" fill="#C084FC">[train]</text><text x="88" y="168" fill="#94A3B8">epoch 37/50  loss: 0.0842</text><animate class="motion" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.39;1" dur="8s" repeatCount="indefinite"/></g>
      <g opacity="1"><text x="24" y="200" fill="#F472B6">[valid]</text><text x="88" y="200" fill="#94A3B8">accuracy: 94.8%  f1: 0.946</text><animate class="motion" attributeName="opacity" values="0;0;1;1" keyTimes="0;0.57;0.61;1" dur="8s" repeatCount="indefinite"/></g>
      <g opacity="1"><text x="24" y="232" fill="#4ADE80">[done]</text><text x="88" y="232" fill="#BBF7D0">best checkpoint saved ✓</text><animate class="motion" attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.82;0.96;1" dur="8s" repeatCount="indefinite"/></g>
      <rect class="motion" x="24" y="256" width="9" height="17" fill="#7DD3FC"><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <g transform="translate(754 94)" font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect width="398" height="238" rx="16" fill="#0B1327" stroke="#312E81"/>
    <text x="24" y="32" fill="#C7D2FE" font-size="12" font-weight="700" letter-spacing="1.2">LIVE METRICS</text><text x="374" y="32" text-anchor="end" fill="#4ADE80" font-size="11">● SYNCED</text>
    <g transform="translate(24 53)"><rect width="350" height="33" rx="8" fill="#111D34"/><text x="12" y="21" fill="#94A3B8" font-size="11">ACCURACY</text><text x="337" y="22" text-anchor="end" fill="#7DD3FC" font-size="14" font-weight="700">94.8%</text><rect x="85" y="13" width="190" height="7" rx="3.5" fill="#1E293B"/><rect x="85" y="13" width="180" height="7" rx="3.5" fill="#38BDF8"><animate class="motion" attributeName="width" values="30;180;176;180" dur="5s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(24 94)"><text x="0" y="15" fill="#64748B" font-size="11">LOSS CURVE</text><path d="M0 121H350M0 82H350M0 43H350" stroke="#334155" stroke-opacity="0.55"/><path d="M5 18C55 20 62 65 112 52S181 91 225 88S294 119 345 112" stroke="#334155" stroke-width="7" stroke-linecap="round"/><path d="M5 18C55 20 62 65 112 52S181 91 225 88S294 119 345 112" stroke="url(#labAccent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="430" stroke-dashoffset="0"><animate class="motion" attributeName="stroke-dashoffset" values="430;0;0" keyTimes="0;0.85;1" dur="5s" repeatCount="indefinite"/></path><circle class="motion" r="5" fill="#F0F9FF" filter="url(#labGlow)"><animateMotion dur="5s" repeatCount="indefinite" path="M5 18C55 20 62 65 112 52S181 91 225 88S294 119 345 112"/></circle></g>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11"><text x="49" y="356" fill="#475569">GPU</text><text x="82" y="356" fill="#7DD3FC">▰▰▰▰▱</text><text x="174" y="356" fill="#475569">PIPELINE</text><text x="236" y="356" fill="#A5B4FC">HEALTHY</text><text x="1082" y="356" fill="#64748B">ITERATION</text><text x="1152" y="356" text-anchor="end" fill="#F9A8D4">#037</text></g>
</svg>
