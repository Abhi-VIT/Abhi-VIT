<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="highlightsTitle highlightsDesc">
  <title id="highlightsTitle">Animated career highlights</title>
  <desc id="highlightsDesc">Animated cards highlight AI experience, IEEE research, and TCS AI Cloud selection.</desc>
  <defs>
    <linearGradient id="highlightBg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse"><stop stop-color="#081627"/><stop offset="0.52" stop-color="#11182F"/><stop offset="1" stop-color="#190F2E"/></linearGradient>
    <filter id="highlightGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  </defs>
  <rect width="1200" height="240" rx="24" fill="url(#highlightBg)"/><rect x="1" y="1" width="1198" height="238" rx="23" stroke="#334155"/>

